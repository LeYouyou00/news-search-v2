{% extends "base.html" %}
{% block title %}注册 - {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-bg">
        <div class="bg-grid"></div>
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-glow bg-glow-2"></div>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">◆</div>
            <h1>{{ app_name }}</h1>
            <p>创建新账号</p>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/register" class="auth-form" id="registerForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username"
                       value="{{ username or '' }}" placeholder="3-80个字符"
                       required minlength="3" maxlength="80" autofocus>
            </div>
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email"
                       value="{{ email or '' }}" placeholder="用于接收推送通知"
                       required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password"
                       placeholder="至少6位密码" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">确认密码</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       placeholder="请再次输入密码" required minlength="6">
            </div>
            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="privacy_consent" id="privacyConsent" value="true">
                    <span class="checkmark"></span>
                    我已阅读并同意<a href="/privacy" target="_blank" class="privacy-link">《隐私政策》</a>
                </label>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="submitBtn" disabled>
                注 册
            </button>
        </form>
        <div class="auth-footer">
            已有账号？<a href="/auth/login">立即登录</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    var cb = document.getElementById('privacyConsent');
    var btn = document.getElementById('submitBtn');
    function toggle() {
        btn.disabled = !cb.checked;
        btn.style.opacity = cb.checked ? '1' : '0.5';
    }
    cb.addEventListener('change', toggle);
    toggle();
})();
</script>
{% endblock %}
